<input type="checkbox" id="modal-login-toggle" class="modal-login-toggle">

<div class="modal" id="modal-login">
    
    <label for="modal-login-toggle" class="modal__overlay"></label>
    
    <div class="modal__content">

        <a href="index.html" class="modal__back">
            <img src="./img/Стрелка.png" alt="Назад">
        </a>

        <img src="./img/Слова.png" alt="" class="modal__decor modal__decor--1">
        <img src="./img/Фразы.png" alt="" class="modal__decor modal__decor--2">
        <img src="./img/Сердце.png" alt="" class="modal__decor modal__decor--3">
        <img src="./img/Избранное.png" alt="" class="modal__decor modal__decor--4">
        <img src="./img/Темы.png" alt="" class="modal__decor modal__decor--5">

        <h2 class="modal__title">Вход</h2>

        <form class="modal-form" action="index.html">
            <div class="modal-form__group">
                <label for="login-email">Почта</label>
                <input type="email" id="login-email" name="email" placeholder="Почта" required>
            </div>
            
            <div class="modal-form__group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••••" required>
            </div>

            <a href="#" class="modal-form__forgot">Забыл пароль</a>


            <a href="index.html" class="modal-form__btn">Войти</a>
        </form>

        <img src="./img/Девушка и парень.png" alt="" class="modal__bg-img">
    </div>
</div>
